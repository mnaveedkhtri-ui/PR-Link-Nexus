<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR-Nexus | 100% Complete VIP SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        /* Tab transitions */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6 py-10">

    <div class="w-full max-w-6xl glass p-8 rounded-2xl shadow-2xl border border-slate-700">
        <div class="flex items-center justify-between mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">🚀 PR-Nexus <span class="text-slate-400 text-lg">A-Z System</span></h1>
                <p class="text-slate-400 text-sm mt-1">AI Pitching, 2-Way Inbox, Database Logging</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-900 px-4 py-2 rounded-full border border-slate-600">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-sm font-semibold text-green-400">System Ready</span>
            </div>
        </div>

        <!-- TABS -->
        <div class="flex border-b border-slate-700 mb-6">
            <button onclick="switchTab('control')" id="tabControl" class="py-2 px-6 text-blue-400 border-b-2 border-blue-500 font-semibold focus:outline-none">Control Center</button>
            <button onclick="switchTab('history')" id="tabHistory" class="py-2 px-6 text-slate-400 hover:text-slate-200 font-semibold focus:outline-none">Database & Reports</button>
        </div>

        <!-- CONTROL CENTER TAB -->
        <div id="content-control" class="tab-content active grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Settings Form -->
            <div class="space-y-6">
                
                <div class="bg-slate-800 p-5 rounded-lg border border-slate-600 shadow-inner">
                    <h2 class="text-lg font-semibold text-blue-300 mb-2">1. Connect Your Email</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">Gmail Address</label>
                            <input id="senderEmail" type="email" placeholder="you@gmail.com" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 focus:border-blue-500 outline-none text-white text-sm shadow-inner">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">App Password</label>
                            <input id="appPassword" type="password" placeholder="16-digit code" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 focus:border-blue-500 outline-none text-white text-sm shadow-inner">
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800 p-5 rounded-lg border border-slate-600 shadow-inner">
                    <h2 class="text-lg font-semibold text-blue-300 mb-2">Target Configuration</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">Your Full Name</label>
                            <input id="founderName" type="text" placeholder="e.g. Naveed Khatri" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 focus:border-blue-500 outline-none text-white text-sm shadow-inner">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">Target Website URL</label>
                            <input id="websiteUrl" type="url" placeholder="https://zyntix.com" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 focus:border-blue-500 outline-none text-white text-sm shadow-inner text-blue-400">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="startVIPAgent()" id="genBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
                        🌟 1. SEND PITCHES
                    </button>
                    
                    <button onclick="startIMAPAgent()" id="imapBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
                        📥 2. SCAN INBOX
                    </button>
                </div>
                
                <div class="mt-4">
                    <button onclick="setActiveClient()" id="activeClientBtn" class="w-full bg-gradient-to-r from-gray-700 to-gray-800 hover:from-gray-600 hover:to-gray-700 text-white font-bold py-3 px-4 rounded-xl border border-gray-600 transition-all duration-300 flex items-center justify-center gap-2">
                        🔒 SET URL AS 24/7 ACTIVE CLIENT
                    </button>
                </div>
            </div>

            <!-- Terminal Output -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <h2 class="text-xl font-semibold text-slate-200">System Logs</h2>
                </div>
                
                <div class="bg-[#0a0f1c] border border-slate-700 rounded-xl p-5 h-[550px] overflow-y-auto relative font-mono text-sm shadow-inner">
                    <div id="pitchOutput" class="text-green-400 whitespace-pre-wrap space-y-2 leading-relaxed">
> VIP System initialized...
> Database loaded.
> Awaiting commands...
                    </div>
                    
                    <div id="loader" class="hidden absolute inset-0 bg-[#0a0f1c] bg-opacity-90 flex flex-col items-center justify-center z-10 rounded-xl">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-purple-500 mb-4" id="loaderSpinner"></div>
                        <p class="text-purple-400 font-mono animate-pulse" id="loaderText">Working...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- HISTORY TAB -->
        <div id="content-history" class="tab-content w-full">
            <h2 class="text-xl font-semibold text-blue-300 mb-4">Live Database Logs</h2>
            <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-inner">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 uppercase">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Journalist</th>
                            <th class="px-6 py-4">Target Query</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Time</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="divide-y divide-slate-700">
                        <!-- Fetched from DB -->
                    </tbody>
                </table>
            </div>
            <button onclick="fetchHistory()" class="mt-4 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-white text-sm font-semibold">
                🔄 Refresh Database
            </button>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('content-' + tab).classList.add('active');
            
            document.getElementById('tabControl').className = "py-2 px-6 font-semibold focus:outline-none " + (tab === 'control' ? "text-blue-400 border-b-2 border-blue-500" : "text-slate-400 hover:text-slate-200");
            document.getElementById('tabHistory').className = "py-2 px-6 font-semibold focus:outline-none " + (tab === 'history' ? "text-blue-400 border-b-2 border-blue-500" : "text-slate-400 hover:text-slate-200");
            
            if(tab === 'history') fetchHistory();
        }
        
        async function loadActiveClient() {
            try {
                const res = await fetch('/api/get-active-client');
                const json = await res.json();
                if(json.website_url) {
                    document.getElementById('website_url').value = json.website_url;
                    appendLog("> [INFO] Loaded Active 24/7 Client: " + json.website_url);
                }
            } catch(e) {}
        }
        
        // Load it on page load
        window.onload = loadActiveClient;

        async function setActiveClient() {
            const url = document.getElementById('website_url').value;
            if(!url) return alert("Please enter a Target Website URL first!");
            
            const btn = document.getElementById('activeClientBtn');
            btn.innerHTML = "SAVING...";
            try {
                const res = await fetch('/api/set-active-client', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({website_url: url})
                });
                const json = await res.json();
                appendLog("\n> " + json.message);
            } catch(e) {
                alert("Error saving: " + e);
            }
            btn.innerHTML = "🔒 SET URL AS 24/7 ACTIVE CLIENT";
        }

        async function fetchHistory() {
            const table = document.getElementById('historyTable');
            table.innerHTML = "<tr><td colspan='5' class='text-center py-4'>Loading database...</td></tr>";
            try {
                const res = await fetch('/api/history');
                const json = await res.json();
                
                if(json.data.length === 0) {
                    table.innerHTML = "<tr><td colspan='5' class='text-center py-4 text-slate-500'>No pitches sent yet. Run the agent!</td></tr>";
                    return;
                }
                
                table.innerHTML = "";
                json.data.forEach(row => {
                    const statusColor = row[3] === 'REPLIED' ? 'text-teal-400' : 'text-blue-400';
                    table.innerHTML += `
                        <tr class="hover:bg-slate-700/50 transition">
                            <td class="px-6 py-4 font-mono text-xs">#${row[0]}</td>
                            <td class="px-6 py-4 font-semibold">${row[1]}</td>
                            <td class="px-6 py-4 truncate max-w-xs">${row[2]}</td>
                            <td class="px-6 py-4 font-bold ${statusColor}">${row[3]}</td>
                            <td class="px-6 py-4 text-slate-500 text-xs">${row[4]}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                table.innerHTML = "<tr><td colspan='5' class='text-center py-4 text-red-500'>Error connecting to database.</td></tr>";
            }
        }

        function getPayload() {
            const s = document.getElementById('senderEmail').value;
            const a = document.getElementById('appPassword').value;
            const f = document.getElementById('founderName').value;
            const w = document.getElementById('websiteUrl').value;
            if(!s || !a || !f || !w) return null;
            return { sender_email: s, app_password: a, founder_name: f, website_url: w };
        }

        async function startVIPAgent() {
            const payload = getPayload();
            if(!payload) return alert("Please fill in ALL fields!");
            const output = document.getElementById('pitchOutput');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            loader.classList.remove('hidden');
            loaderText.innerText = "Scraping Live Internet Feeds...";
            try {
                const response = await fetch('/api/run-vip-autonomous', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                output.innerHTML += `\n\n` + data.logs.join('\n');
            } catch (err) {
                output.innerHTML += `\n\n> [❌ FATAL ERROR] Connection lost.`;
            } finally { loader.classList.add('hidden'); }
        }

        async function startIMAPAgent() {
            const payload = getPayload();
            if(!payload) return alert("Please fill in ALL fields!");
            const output = document.getElementById('pitchOutput');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            loader.classList.remove('hidden');
            loaderText.innerText = "Logging into Gmail IMAP Server...";
            try {
                const response = await fetch('/api/run-imap-agent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                output.innerHTML += `\n\n` + data.logs.join('\n');
            } catch (err) {
                output.innerHTML += `\n\n> [❌ FATAL ERROR] Connection lost.`;
            } finally { loader.classList.add('hidden'); }
        }
    </script>
</body>
</html>
